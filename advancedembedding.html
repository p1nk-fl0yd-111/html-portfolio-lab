<!DOCTYPE html>
<head>
  <title>Advanced embedding example</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 500px;
      margin: 40px auto;
      padding: 0 16px;
    }

    a {
      margin-right: 12px;
    }

    object, embed, iframe {
      display: block;
      margin-top: 10px;
      border: 1px solid #ccc;
    }

    hr {
      margin: 24px 0;
    }
  </style>
</head>
<body>

  <p>
    <a href="https://p1nk-fl0yd-111.github.io/html-portfolio-lab/">Index</a>
    <a href="https://p1nk-fl0yd-111.github.io/html-portfolio-lab/video.html">Video</a>
    <a href="https://p1nk-fl0yd-111.github.io/html-portfolio-lab/advancedembedding.html">Advanced embedding</a>
    <a href="https://p1nk-fl0yd-111.github.io/html-portfolio-lab/audio.html">Audio</a>
    <a href="https://p1nk-fl0yd-111.github.io/html-portfolio-lab/lab2.html">Lab 2</a>
  </p>

  <hr>

  <h2>Additional documents &amp; media</h2>

  <h3>Here are some facts about red pandas</h3>
  <object data="Other files/Red_Panda_Infosheet_Print.pdf" type="application/pdf" width="100%" height="500">
    <p>It appears your browser doesn't support embedded PDFs.
    You can <a href="Other files/Red_Panda_Infosheet_Print.pdf">download the infosheet PDF</a> instead.</p>
  </object>

  <h3>A graphic (via &lt;embed&gt;)</h3>
  <p>Here is an embedded graphic</p>
  <embed src="Other files/Red_Panda_Infosheet_Print.pdf" type="application/pdf" width="100%" height="400">

  <h3>An external webpage (via &lt;iframe&gt;)</h3>
  <p>Here is one of my favorite websites, embedded directly on this page:</p>
  <iframe src="https://en.wikipedia.org/wiki/Red_panda" title="Embedded external webpage" width="100%" height="400">
    Your browser does not support iframes.
  </iframe>

  <hr>

</body>
</html>
